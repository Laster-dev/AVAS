# AVAS TeamServer 配置文件
# 使用INI格式，简单可靠
# 格式：端口-类型-开启状态

[Client]
# Client监听器配置
Port=50050
BindAddress=0.0.0.0
Enabled=true

[Beacon_Listeners]
# Beacon监听器配置
# 格式：端口=类型:启用状态
# 类型：TCP, UDP, HTTP, WebSocket, ICMP, SMB
# 启用状态：true, false
8888=TCP:false
9999=TCP:false
7777=UDP:false
6666=UDP:false
8080=HTTP:false
9090=HTTP:false
3000=WebSocket:false
4000=WebSocket:false
445=SMB:false
139=SMB:false
# ICMP不需要端口，单独配置
ICMP=false

[Logging]
# 日志系统配置
LogLevel=Info
EnableConsoleLog=true
EnableFileLog=true
EnableColorLog=true
LogFilePath=logs/teamserver.log
ShowLogTimestamp=true
ShowLogModule=true
ShowLogSession=true
